spring.application.name=loan-application

# Server port
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Database Configuration is handled by RailwayDatabaseConfig.java
# It automatically detects DATABASE_URL and configures PostgreSQL or H2 appropriately.

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Swagger UI / OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
